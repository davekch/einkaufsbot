[project]
name = "einkaufsbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiosqlite>=0.21.0",
    "python-telegram-bot[job-queue]==20.7",
    "pyyaml>=6.0.2",
    "sqlalchemy[asyncio]>=2.0.38",
]

[dependency-groups]
dev = [
    "telethon>=1.39.0",
]

[project.scripts]
einkaufsbot = "einkaufsbot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
